name: PR Title Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]./_-]+\))?!?: [^[:space:]].*$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          echo "::error title=Invalid pull request title::Use a Conventional Commit title, for example: feat(scope): add capability"
          exit 1
