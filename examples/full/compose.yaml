# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/refs/tags/v2.10.1/schema/compose-spec.json
name: hello-world

services:
  server:
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_MESSAGE: "Hello from compose!"
    ports:
      - "8080:8080"
    volumes:
      - hello-data:/var/lib/hello
    configs:
      - source: app_config
        target: /app/config.yml
    secrets:
      - source: app_secret
        target: app-secret
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/server.py", "--healthcheck"]

  db:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data

volumes:
  hello-data: {}
  redis-data: {}

configs:
  app_config:
    content: |
      server:
        greeting: "Hello from config map"

secrets:
  app_secret:
    file: ./app-secret.txt

x-uds:
  network:
    expose:
      - service: server
        host: hello-world
  monitor:
    - service: server
      description: Server metrics
