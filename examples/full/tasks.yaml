# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/tasks.schema.json
includes:
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/create.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/lint.yaml
  - pull: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/pull.yaml
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/deploy.yaml
  - setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/setup.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/actions.yaml
  - upgrade: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/upgrade.yaml
  - publish: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.24.14/tasks/publish.yaml

tasks:
  - name: default
    description: Setup k3d cluster, deploy package
    actions:
      - task: create-dev-package
      - task: setup:k3d-full-cluster
      - task: create-deploy-test-bundle

  - name: create-dev-package
    description: Create the package
    actions:
      - task: create:package
        with:
          options: "--skip-sbom"

  - name: create-deploy-test-bundle
    description: Test and validate cluster is deployed with the package
    actions:
      - task: create:test-bundle
      - task: deploy:test-bundle
      - task: setup:keycloak-user

  - name: dev
    description: Create and deploy the bundle on an existing cluster (for iteration/dev speed)
    actions:
      - task: create-dev-package
      - task: create:test-bundle
      - task: deploy:test-bundle

# CI will execute the following (via uds-common/.github/workflows/callable-test.yaml) so they need to be here with these names

  - name: test-install
    description: Test deploying the current branch to a new cluster
    actions:
      - task: create-dev-package
      - task: setup:k3d-test-cluster
      - task: create-deploy-test-bundle

  - name: test-upgrade
    # requires a prior published version to exist
    description: Test an upgrade from the latest released package to the current branch
    actions:
      - task: upgrade:create-latest-tag-bundle
      - task: setup:k3d-test-cluster
      - task: deploy:test-bundle
      - task: create-dev-package
      - task: create-deploy-test-bundle

  - name: publish-package
    description: Build and publish the packages
    actions:
      - description: Create the package
        task: create:package

      - description: Setup the cluster
        task: setup:k3d-test-cluster

      - description: Create deploy and test the bundle
        task: create-deploy-test-bundle

      - description: Publish the packages
        task: publish:package
