name: react-fastapi-postgres

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    user: "10001"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    user: "101"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - name: http
        target: 8080
        published: "8080"
        protocol: tcp
        app_protocol: http
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -q 'Compose Bridge'"]
      interval: 10s
      timeout: 3s
      retries: 3

x-uds:
  package:
    name: react-fastapi-postgres
    namespace: react-fastapi-postgres
    version: 0.1.0
  network:
    expose:
      - service: ui
        host: react-fastapi-postgres
  sso:
    - name: React FastAPI Postgres
      clientId: react-fastapi-postgres
      redirectUris:
        - https://react-fastapi-postgres.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/name: ui
