name: react-fastapi-postgres

services:
  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
    user: "101"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - name: http
        target: 8080
        published: "8080"
        protocol: tcp
        app_protocol: http
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -q 'Compose Bridge'"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    user: "10001"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: messages
      POSTGRES_USER_FILE: /run/secrets/postgres-username
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-username
      - postgres-password
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:18.4-bookworm
    x-uds-exclude: true
    user: "999"
    environment:
      POSTGRES_DB: messages
      POSTGRES_USER_FILE: /run/secrets/postgres-username
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-username
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username messages --dbname messages
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data: {}

secrets:
  postgres-username:
    # Development-only value for local Compose. The deployed file comes from an external Secret.
    file: ./postgres-username.dev.txt
  postgres-password:
    # Development-only value for local Compose. The deployed file comes from an external Secret.
    file: ./postgres-password.dev.txt

x-uds:
  package:
    name: react-fastapi-postgres
    namespace: react-fastapi-postgres
    version: 0.1.0
  network:
    expose:
      - service: ui
        host: react-fastapi-postgres
  sso:
    - name: React FastAPI Postgres
      clientId: react-fastapi-postgres
      redirectUris:
        - https://react-fastapi-postgres.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/name: ui
