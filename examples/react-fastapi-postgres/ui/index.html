<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A React application packaged for UDS with Compose Bridge" />
    <title>React on UDS</title>
    <style>
      .boot-screen {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        background: #08111f;
        color: #e5eefb;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      .boot-screen h1,
      .boot-screen p {
        margin: 0;
      }

      .boot-screen h1 {
        font-size: clamp(2rem, 6vw, 4rem);
      }

      .boot-screen p {
        color: #67e8f9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <h1>React on UDS</h1>
        <p>Loading the application...</p>
      </main>
    </div>
    <noscript>
      <main class="boot-screen">
        <h1>React on UDS</h1>
        <p>JavaScript is required to run this application.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
