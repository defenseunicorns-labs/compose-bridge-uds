name: hello-world

services:
  hello-world:
    build:
      context: .
    image: keel.local/hello:latest
    env_file:
      - .env
    environment:
      APP_MESSAGE: "Hello from compose!"
    ports:
      - "8080:8080"
    volumes:
      - hello-data:/var/lib/hello
    configs:
      - source: app_config
        target: /app/config.yml
    secrets:
      - source: app_secret
        target: app-secret
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/app/server.py", "--healthcheck"]

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data

  debugger:
    image: busybox:1.36
    command: ["sh", "-c", "sleep infinity"]
    profiles: ["debug"]

volumes:
  hello-data: {}
  redis-data: {}

configs:
  app_config:
    content: |
      server:
        greeting: "Hello from config map"

secrets:
  app_secret:
    file: ./app-secret.txt
