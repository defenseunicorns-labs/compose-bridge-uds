apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
    name: hello-world
    namespace: hello-world
spec:
    network:
        serviceMesh:
            mode: ambient
        expose:
            - service: hello-world
              selector:
                app.kubernetes.io/name: hello-world
              gateway: tenant
              host: hello-world
              port: 8080
        allow:
            - direction: Ingress
              remoteGenerated: IntraNamespace
            - direction: Egress
              remoteGenerated: IntraNamespace
