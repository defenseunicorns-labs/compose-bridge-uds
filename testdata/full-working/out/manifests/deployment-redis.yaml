apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis
    namespace: hello-world
    labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: hello-world
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: redis
    template:
        metadata:
            name: ""
            labels:
                app.kubernetes.io/name: redis
        spec:
            containers:
                - name: redis
                  image: redis:7-alpine
                  imagePullPolicy: IfNotPresent
                  ports:
                    - name: http
                      containerPort: 6379
                      protocol: TCP
                  volumeMounts:
                    - name: volume-redis-data
                      mountPath: /data
            volumes:
                - name: volume-redis-data
                  persistentVolumeClaim:
                    claimName: redis-data
