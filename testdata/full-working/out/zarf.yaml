# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
    name: hello-world
    description: UDS package generated from Docker Compose for hello-world
    version: 0.1.0
variables:
    - name: APP_SECRET
      description: Value for compose secret app-secret
      prompt: true
      sensitive: true
components:
    - name: redis
      required: true
      description: Deploy redis
      manifests:
        - name: redis-manifests
          namespace: hello-world
          files:
            - manifests/namespace.yaml
            - manifests/pvc-redis-data.yaml
            - manifests/deployment-redis.yaml
            - manifests/service-redis.yaml
      images:
        - redis:7-alpine
    - name: hello-world
      required: true
      description: Deploy hello-world
      manifests:
        - name: hello-world-manifests
          namespace: hello-world
          files:
            - manifests/namespace.yaml
            - manifests/pvc-hello-data.yaml
            - manifests/secret-app-secret.yaml
            - manifests/configmap-app-config.yaml
            - manifests/deployment-hello-world.yaml
            - manifests/service-hello-world.yaml
            - manifests/uds-package.yaml
      images:
        - keel.local/hello:latest
        - busybox:1.36
